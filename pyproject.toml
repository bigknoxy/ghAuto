[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghauto"
version = "0.2.30"
description = "GitHub Repository Management and Analysis Tool"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "aiohttp>=3.14.3",
    "pydantic>=2.13.5",
    "apscheduler>=3.11.3",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.0.54",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "python-dotenv>=1.2.4",
    "pyjwt>=2.15.1",
    "passlib>=1.7.4",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]

[project.scripts]
ghauto = "cli:app"

[tool.setuptools.package-data]
ghauto = ["../../dashboard/**", "../../dashboard/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Rules ignored because they surface pre-existing patterns in this codebase
# that are not security-relevant and would block Dependabot bumps.
ignore = [
    "PLW1510",
    "BLE001",
    "SIM117",
    "S110",
    "DTZ003",
    "DTZ001",
    "B017",
    "SIM102",
    "PIE810",
    "PLR1704",
    "EXE001",
    "I001",
    "UP045",
    "UP024",
]