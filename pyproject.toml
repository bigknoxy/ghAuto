[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghauto"
version = "0.2.30"
description = "GitHub Repository Management and Analysis Tool"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.52.4",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.26.1",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.13.0",
    "passlib>=1.7.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.0.280",
    "mypy>=1.5.0",
]

[project.scripts]
ghauto = "cli:app"

[tool.setuptools.package-data]
ghauto = ["../../dashboard/**", "../../dashboard/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"