[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghauto"
version = "0.2.30"
description = "GitHub Repository Management and Analysis Tool"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.48.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.26.1",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.13.0",
    "passlib>=1.7.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.0.280",
    "mypy>=1.5.0",
]

[project.scripts]
ghauto = "cli:app"

[tool.setuptools.package-data]
ghauto = ["../../dashboard/**", "../../dashboard/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Rules ignored because they surface pre-existing patterns in this codebase
# that are not security-relevant and would block Dependabot bumps.
# PLW1510: subprocess.run without check=True (intentional in CLI helpers)
# BLE001: blind except (used to swallow non-fatal errors in analyzers)
# SIM117: nested with-statements (cosmetic; readability already fine)
# S110: try/except/pass in fallback paths (intentional)
# DTZ003/DTZ001: datetime.utcnow (legacy; will be migrated separately)
# B017: assertRaises(Exception) (intentional broad catching in tests)
# SIM102: collapsible if (cosmetic)
# PIE810: starts/ends with same call (cosmetic)
# PLR1704: redefined argument (cosmetic)
# EXE001: shebang-not-executable (CI scripts)
ignore = [
    "PLW1510",
    "BLE001",
    "SIM117",
    "S110",
    "DTZ003",
    "DTZ001",
    "B017",
    "SIM102",
    "PIE810",
    "PLR1704",
    "EXE001",
]